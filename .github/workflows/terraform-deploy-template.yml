name: Terraform Deploy Template

on:
  workflow_call:
    inputs:
      terraform_working_directory:
        description: Terraform working directory relative to repository root
        required: true
        type: string

      terraform_version:
        description: Terraform version to install
        required: true
        type: string

      tfvars_file:
        description: Optional tfvars file path relative to terraform_working_directory
        required: false
        default: ""
        type: string

      terraform_variables:
        description: Optional space-separated Terraform variables in key=value form
        required: false
        default: ""
        type: string

      plan_file_name:
        description: Terraform plan filename written in terraform_working_directory
        required: false
        default: terraform.tfplan
        type: string

      plan_artifact_name:
        description: Artifact name used to pass the Terraform plan from plan to apply
        required: false
        default: terraform-plan
        type: string

      azure_subscription_id:
        description: Azure subscription ID for OIDC login (optional)
        required: false
        default: ""
        type: string

      backend_resource_group_name:
        description: Azure resource group name for Terraform state storage
        required: true
        type: string

      backend_storage_account_name:
        description: Azure storage account name for Terraform state storage
        required: true
        type: string

      backend_subscription_id:
        description: Azure subscription ID hosting Terraform state storage (optional)
        required: false
        default: ""
        type: string

      backend_container_name:
        description: Azure blob container name for Terraform state storage
        required: true
        type: string

      backend_key:
        description: Terraform state key
        required: true
        type: string

      apply_environment_name:
        description: GitHub Environment name used to gate Terraform apply
        required: false
        default: terraform-apply
        type: string

      run_apply:
        description: Run Terraform apply when true
        required: false
        default: false
        type: boolean

    outputs:
      has_changes:
        description: True when terraform plan reports changes
        value: ${{ jobs.plan.outputs.has_changes }}

    secrets:
      azure_client_id:
        description: Azure application or managed identity client ID
        required: true

      azure_tenant_id:
        description: Azure tenant ID
        required: true

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    # Suffixed with the run ID so reruns don't collide on the same artifact/plan file.
    env:
      PLAN_FILE_NAME: "${{ inputs.plan_file_name }}-${{ github.run_id }}"
    outputs:
      has_changes: ${{ steps.plan.outputs.has_changes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Terraform Init
        uses: $/.github/actions/terraform-init
        with:
          terraform_working_directory: ${{ inputs.terraform_working_directory }}
          terraform_version: ${{ inputs.terraform_version }}
          azure_client_id: ${{ secrets.azure_client_id }}
          azure_tenant_id: ${{ secrets.azure_tenant_id }}
          azure_subscription_id: ${{ inputs.azure_subscription_id }}
          backend_resource_group_name: ${{ inputs.backend_resource_group_name }}
          backend_storage_account_name: ${{ inputs.backend_storage_account_name }}
          backend_subscription_id: ${{ inputs.backend_subscription_id }}
          backend_container_name: ${{ inputs.backend_container_name }}
          backend_key: ${{ inputs.backend_key }}

      - name: Terraform Plan
        id: plan
        uses: $/.github/actions/terraform-plan
        with:
          terraform_working_directory: ${{ inputs.terraform_working_directory }}
          tfvars_file: ${{ inputs.tfvars_file }}
          terraform_variables: ${{ inputs.terraform_variables }}
          plan_file_name: ${{ env.PLAN_FILE_NAME }}
          plan_artifact_name: ${{ inputs.plan_artifact_name }}

      # - name: Render plan summary for PR comment
      #   id: render
      #   if: steps.plan.outcome == 'success'
      #   uses: $/.github/actions/terraform-plan-render-summary
      #   with:
      #     terraform_working_directory: ${{ inputs.terraform_working_directory }}
      #     plan_file_name: ${{ env.PLAN_FILE_NAME }}

      - name: Add plan output to job summary
        if: steps.render.outcome == 'success'
        shell: bash
        env:
          PLAN_SUMMARY: ${{ steps.render.outputs.plan_summary }}
        run: |
          {
            echo "## Terraform Plan"
            echo
            echo '```text'
            printf '%s\n' "$PLAN_SUMMARY"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # - name: Comment plan output on PR
      #   if: github.event_name == 'pull_request' && steps.plan.outcome == 'success'
      #   uses: $/.github/actions/terraform-plan-pr-comment
      #   with:
      #     github_token: ${{ github.token }}
      #     plan_output: ${{ steps.render.outputs.plan_summary }}
      #     working_directory: ${{ inputs.terraform_working_directory }}
      #     comment_identifier: ${{ inputs.plan_artifact_name }}

  apply:
    needs: plan
    if: ${{ inputs.run_apply && needs.plan.outputs.has_changes == 'true' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.apply_environment_name }}
    permissions:
      contents: read
      id-token: write
    env:
      PLAN_FILE_NAME: "${{ inputs.plan_file_name }}-${{ github.run_id }}"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Terraform Init
        uses: $/.github/actions/terraform-init
        with:
          terraform_working_directory: ${{ inputs.terraform_working_directory }}
          terraform_version: ${{ inputs.terraform_version }}
          azure_client_id: ${{ secrets.azure_client_id }}
          azure_tenant_id: ${{ secrets.azure_tenant_id }}
          azure_subscription_id: ${{ inputs.azure_subscription_id }}
          backend_resource_group_name: ${{ inputs.backend_resource_group_name }}
          backend_storage_account_name: ${{ inputs.backend_storage_account_name }}
          backend_subscription_id: ${{ inputs.backend_subscription_id }}
          backend_container_name: ${{ inputs.backend_container_name }}
          backend_key: ${{ inputs.backend_key }}

      - name: Terraform Apply
        uses: $/.github/actions/terraform-apply
        with:
          terraform_working_directory: ${{ inputs.terraform_working_directory }}
          plan_file_name: ${{ env.PLAN_FILE_NAME }}
          plan_artifact_name: ${{ inputs.plan_artifact_name }}
