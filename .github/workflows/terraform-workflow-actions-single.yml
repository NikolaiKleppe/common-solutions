name: Terraform - Plan or Apply (Single Workflow)

on:
  workflow_call:
    inputs:
      operation:
        description: Operation to perform (plan or apply)
        required: true
        type: string

      terraform_working_directory:
        description: Terraform working directory relative to repository root
        required: true
        type: string

      terraform_version:
        description: Terraform version to install
        required: false
        default: v1.15.8
        type: string

      azure_subscription_id:
        description: Azure subscription ID for OIDC login (optional)
        required: false
        default: ""
        type: string

      tfvars_file:
        description: Optional tfvars file path relative to terraform_working_directory
        required: false
        default: ""
        type: string

      plan_file_name:
        description: Terraform plan filename written in terraform_working_directory
        required: false
        default: terraform.tfplan
        type: string

      plan_artifact_name:
        description: Artifact name used to store/retrieve the Terraform plan
        required: false
        default: terraform-plan
        type: string

      backend_resource_group_name:
        description: Azure resource group name for Terraform state storage
        required: true
        type: string

      backend_storage_account_name:
        description: Azure storage account name for Terraform state storage
        required: true
        type: string

      backend_subscription_id:
        description: Azure subscription ID hosting Terraform state storage (optional)
        required: false
        default: ""
        type: string

      backend_container_name:
        description: Azure blob container name for Terraform state storage
        required: true
        type: string

      backend_key:
        description: Terraform state key
        required: true
        type: string

      apply_environment_name:
        description: GitHub Environment name used to gate Terraform apply
        required: false
        default: terraform-apply
        type: string

    secrets:
      AZURE_CLIENT_ID:
        description: Azure application or managed identity client ID
        required: true

      AZURE_TENANT_ID:
        description: Azure tenant ID
        required: true

    outputs:
      has_changes:
        description: True when terraform plan reports changes
        value: ${{ jobs.terraform.outputs.has_changes }}

env:
  AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

jobs:
  terraform:
    name: Terraform ${{ inputs.operation }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.operation == 'apply' && inputs.apply_environment_name || '' }}
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    outputs:
      has_changes: ${{ steps.plan.outputs.has_changes }}
    steps:

      # 1. Check out the CALLER repository code
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Parse the branch/tag from the reusable workflow's native context
      # See: https://stackoverflow.com/a/58035262/5171464
      - name: Parse Reusable Workflow Ref
        id: parse-ref
        run: |
          # Extracts everything after the "@" symbol
          echo "GIT_BRANCH=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}" >> $GITHUB_ENV

      # 3. Check out the CENTRAL repository to a subfolder using that exact ref
      - name: Checkout Central DevOps Actions
        uses: actions/checkout@v4
        with:
          repository: NikolaiKleppe/common-solutions
          ref: ${{ env.GIT_BRANCH }}
          path: /actions/shared

      - name: Install tree and list files
        run: |
          sudo apt-get install -y tree
          tree -a -I '.git|.terraform'

      - name: Terraform Init
        uses: ./.github/actions/shared/actions/terraform-init
        with:
          terraform_working_directory: ${{ inputs.terraform_working_directory }}
          terraform_version: ${{ inputs.terraform_version }}
          azure_client_id: ${{ env.AZURE_CLIENT_ID }}
          azure_tenant_id: ${{ env.AZURE_TENANT_ID }}
          azure_subscription_id: ${{ inputs.azure_subscription_id }}
          backend_resource_group_name: ${{ inputs.backend_resource_group_name }}
          backend_storage_account_name: ${{ inputs.backend_storage_account_name }}
          backend_subscription_id: ${{ inputs.backend_subscription_id }}
          backend_container_name: ${{ inputs.backend_container_name }}
          backend_key: ${{ inputs.backend_key }}

      - name: Terraform Plan
        id: plan
        uses: ./.github/actions/shared/actions/terraform-plan
        with:
          terraform_working_directory: ${{ inputs.terraform_working_directory }}
          tfvars_file: ${{ inputs.tfvars_file }}
          plan_file_name: ${{ inputs.plan_file_name }}
          plan_artifact_name: ${{ inputs.plan_artifact_name }}
          upload_artifact: ${{ inputs.operation == 'plan' && 'true' || 'false' }}

      - name: Terraform Apply
        if: ${{ inputs.operation == 'apply' }}
        uses: ./.github/actions/shared/actions/terraform-apply
        with:
          terraform_working_directory: ${{ inputs.terraform_working_directory }}
          plan_file_name: ${{ inputs.plan_file_name }}
          plan_artifact_name: ${{ inputs.plan_artifact_name }}
