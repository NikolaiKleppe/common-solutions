name: Composite Action - Terraform Plan
description: Shared Terraform plan

inputs:
  plan_file_name:
    description: Terraform plan filename written in terraform_working_directory
    required: false
    default: terraform.tfplan
    type: string

  terraform_working_directory:
    description: Terraform working directory relative to repository root
    required: true
    type: string

  tfvars_file:
    description: Optional tfvars file path relative to terraform_working_directory
    required: false
    default: ""
    type: string

  terraform_variables:
    description: Optional space-separated Terraform variables in key=value form
    required: false
    default: ""
    type: string

  plan_artifact_name:
    description: Artifact name used to store the Terraform plan
    required: true
    type: string

runs:
  using: composite
  steps:
  - name: Terraform Plan
    id: plan
    shell: bash
    env:
      TERRAFORM_VARIABLES: ${{ inputs.terraform_variables }}
    run: |
      set -euo pipefail

      plan_file_path="${{ inputs.terraform_working_directory }}/${{ inputs.plan_file_name }}"

      tfvars_arg=()
      if [ -n "${{ inputs.tfvars_file }}" ]; then
        tfvars_arg+=("-var-file=${{ inputs.tfvars_file }}")
      fi

      if [ -n "${TERRAFORM_VARIABLES}" ]; then
        read -r -a terraform_variables <<< "${TERRAFORM_VARIABLES}"
        for terraform_variable in "${terraform_variables[@]}"; do
          tfvars_arg+=("-var=${terraform_variable}")
        done
      fi

      set +e
      terraform -chdir="${{ inputs.terraform_working_directory }}" plan \
        -input=false \
        -detailed-exitcode \
        -out="${{ inputs.plan_file_name }}" \
        "${tfvars_arg[@]}"
      exit_code=$?
      set -e

      if [ "$exit_code" -eq 1 ]; then
        echo "Terraform plan failed."
        exit 1
      fi

      if [ "$exit_code" -eq 2 ]; then
        echo "has_changes=true" >> "$GITHUB_OUTPUT"
      else
        echo "has_changes=false" >> "$GITHUB_OUTPUT"
      fi

  - name: Upload plan artifact
    uses: actions/upload-artifact@v4
    with:
      name: ${{ inputs.plan_artifact_name }}
      path: ${{ inputs.terraform_working_directory }}/${{ inputs.plan_file_name }}
      retention-days: 5